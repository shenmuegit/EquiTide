name: usdt-quant
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usdt_quant
      POSTGRES_USER: usdt_quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usdt_quant_local}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usdt_quant -d usdt_quant"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:${USDT_QUANT_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://usdt_quant:${POSTGRES_PASSWORD:-usdt_quant_local}@database:5432/usdt_quant
      USDT_QUANT_DATA_ROOT: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      database:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${USDT_QUANT_PORT:-5178}:80"
    depends_on:
      - api
volumes:
  postgres:
