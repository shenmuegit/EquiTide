[project]
name = "usdt-quant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "nautilus_trader==2.0.0rc5",
    "numpy>=2,<3",
    "polars>=1.34,<2",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn>=1.7,<2",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"
